---
layout: default
author_profile: false
---

<article class="life-section life-section--{{ page.life_style | default: 'default' }}">
  <a class="life-section__back" href="{{ '/life/' | relative_url }}" target="_self"><span aria-hidden="true">←</span> My Life</a>

  <header class="life-section__header">
    <div class="life-section__icon" aria-hidden="true"><i class="fas {{ page.life_icon }}"></i></div>
    <p>{{ page.life_eyebrow }}</p>
    <h1>{{ page.title }}</h1>
    <div class="life-section__intro">{{ page.excerpt }}</div>
  </header>

  <div class="life-section__body">
    {{ content }}
  </div>

  <footer class="life-section__footer">
    <a class="life-section__back" href="{{ '/life/' | relative_url }}" target="_self"><span aria-hidden="true">←</span> Back to My Life</a>
  </footer>
</article>
