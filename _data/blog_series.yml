- slug: critical-thinking
  title: "Critical Thinking"
  description: "从技术、哲学与社会制度出发，追问那些看似理所当然的判断。"
  introduction: "把熟悉的概念重新拆开：自由是否需要脱离因果，技术何时开始替我们判断，责任又该由谁承担。"
  topic_slug: philosophy-ideas
