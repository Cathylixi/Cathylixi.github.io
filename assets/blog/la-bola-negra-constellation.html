        [&#x27;inheritance&#x27;,&#x27;bypass&#x27;],[&#x27;bypass&#x27;,&#x27;teresa&#x27;],[&#x27;bypass&#x27;,&#x27;alberto&#x27;],[&#x27;inheritance&#x27;,&#x27;trauma&#x27;],[&#x27;cmbyn&#x27;,&#x27;classical&#x27;],[&#x27;cmbyn&#x27;,&#x27;salvage&#x27;],[&#x27;classical&#x27;,&#x27;lorca&#x27;],[&#x27;salvage&#x27;,&#x27;recognition&#x27;]
      ];

      const nodes = rawNodes.map((d, index) =&gt; ({
        id: d[0], label: d[1], group: d[2], importance: d[3], nx: d[4], ny: d[5], detail: d[6], subtitle: d[7] || &#x27;&#x27;,
        x: 0, y: 0, baseX: 0, baseY: 0, anchorX: 0, anchorY: 0, radius: 0, scale: 1,
        driftPhase: index * 2.39996,
        driftSpeed: .00016 + (index % 7) * .000012,
        driftAmpX: (6.5 + (index % 5) * 1.45) * (d[3] &gt;= 4 ? .35 : d[3] === 3 ? .7 : 1),
        driftAmpY: (4.8 + (index % 4) * 1.5) * (d[3] &gt;= 4 ? .35 : d[3] === 3 ? .7 : 1)
      }));
      const nodeById = new Map(nodes.map((n) =&gt; [n.id, n]));
      const links = edges.map((e, i) =&gt; ({ index: i, source: nodeById.get(e[0]), target: nodeById.get(e[1]), relation: e[2] || null, bend: ((i % 5) - 2) * 0.035 }));
      const adjacency = new Map(nodes.map((n) =&gt; [n.id, new Set()]));
      links.forEach((l) =&gt; {
        adjacency.get(l.source.id).add(l.target.id);
        adjacency.get(l.target.id).add(l.source.id);
      });

      let width = 0;
      let height = 0;
      let dpr = 1;
      let hoverId = null;
      let hoverLinkIndex = null;
      let lockedId = null;
      let dragNode = null;
      let dragStart = null;
      let pointer = { x: -9999, y: -9999 };
      let starColor = &#x27;&#x27;;
      let softColor = &#x27;&#x27;;
      let orangeColor = &#x27;&#x27;;
      let whiteColor = &#x27;&#x27;;
      let animating = false;
      let motionLoopStarted = false;
      let driftPaused = false;
      let zoomLevel = 1;
      let panStart = null;
      const previousLabelAnchors = new Map();
      const centerIds = new Set([&#x27;carlos&#x27;,&#x27;rafael&#x27;,&#x27;sebastian&#x27;,&#x27;alberto&#x27;,&#x27;lorca&#x27;]);
      const anchors = new Set([&#x27;homosexuality&#x27;,&#x27;carlos&#x27;,&#x27;rafael&#x27;,&#x27;sebastian&#x27;,&#x27;alberto&#x27;,&#x27;lorca&#x27;,&#x27;blackball&#x27;,&#x27;snow&#x27;]);
      const majorIds = new Set([
        &#x27;homosexuality&#x27;,&#x27;carlos&#x27;,&#x27;rafael&#x27;,&#x27;sebastian&#x27;,&#x27;alberto&#x27;,&#x27;blackball&#x27;,&#x27;snow&#x27;,
        &#x27;lorca&#x27;,&#x27;manuscript&#x27;,&#x27;recognition&#x27;,&#x27;civilwar&#x27;,&#x27;shame&#x27;,&#x27;inheritance&#x27;
      ]);
      const dust = Array.from({ length: 30 }, (_, i) =&gt; {
        const x = Math.abs(Math.sin((i + 3) * 91.731)) % 1;
        const y = Math.abs(Math.sin((i + 17) * 47.193)) % 1;
        return { x, y, r: .4 + (i % 3) * .16, a: .035 + (i % 5) * .014 };
      });

      function readTheme() {
        const style = getComputedStyle(root);
        starColor = style.getPropertyValue(&#x27;--lb-star&#x27;).trim();
        softColor = style.getPropertyValue(&#x27;--lb-star-soft&#x27;).trim();
        orangeColor = style.getPropertyValue(&#x27;--lb-orange&#x27;).trim();
        whiteColor = style.getPropertyValue(&#x27;--lb-white&#x27;).trim();
      }

      function resize() {
        const rect = stage.getBoundingClientRect();
        width = Math.max(320, rect.width);
        height = rect.height;
        dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + &#x27;px&#x27;;
        canvas.style.height = height + &#x27;px&#x27;;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        zoomLevel = 1;
        const topPad = width &lt; 680 ? 34 : 24;
        const bottomPad = width &lt; 680 ? 165 : 115;
        const usableHeight = height - topPad - bottomPad;
        const centerX = width / 2;
        const centerY = topPad + usableHeight * .49;
        const maxRadiusX = width * .455;
        const maxRadiusY = usableHeight * .47;

        function placeRing(ids, radiusX, radiusY, startAngle) {
          const ordered = ids.map((id) =&gt; nodeById.get(id)).filter(Boolean);
          ordered.forEach((n, index) =&gt; {
            const hash = Array.from(n.id).reduce((sum, ch) =&gt; sum + ch.charCodeAt(0) * 17, 0);
            const noiseA = Math.abs(Math.sin(hash * 12.9898) * 43758.5453) % 1;
            const noiseB = Math.abs(Math.sin(hash * 7.1234) * 19341.1379) % 1;
            const angle = startAngle + (Math.PI * 2 * index) / Math.max(1, ordered.length) + (noiseA - .5) * .16;
            const wobble = .91 + noiseB * .18;
            n.baseX = centerX + Math.cos(angle) * radiusX * wobble;
            n.baseY = centerY + Math.sin(angle) * radiusY * wobble;
          });
        }

        const characterOrder = [&#x27;lorca&#x27;,&#x27;rafael&#x27;,&#x27;alberto&#x27;,&#x27;sebastian&#x27;,&#x27;carlos&#x27;];
        const innerMajor = nodes.filter((n) =&gt; majorIds.has(n.id) &amp;&amp; n.id !== &#x27;homosexuality&#x27; &amp;&amp; !centerIds.has(n.id)).map((n) =&gt; n.id);
        const highTier = nodes.filter((n) =&gt; n.importance === 3 &amp;&amp; !majorIds.has(n.id) &amp;&amp; !centerIds.has(n.id)).map((n) =&gt; n.id);
        const middleTier = nodes.filter((n) =&gt; n.importance === 2 &amp;&amp; !majorIds.has(n.id)).map((n) =&gt; n.id);
        const outerTier = nodes.filter((n) =&gt; n.importance &lt;= 1 &amp;&amp; !majorIds.has(n.id)).map((n) =&gt; n.id);

        const origin = nodeById.get(&#x27;homosexuality&#x27;);
        origin.baseX = centerX;
        origin.baseY = centerY;
        placeRing(characterOrder, maxRadiusX * .34, maxRadiusY * .32, -Math.PI / 2);
        placeRing(innerMajor, maxRadiusX * .58, maxRadiusY * .56, -Math.PI * .18);
        placeRing(highTier, maxRadiusX * .75, maxRadiusY * .73, Math.PI * .07);
        placeRing(middleTier, maxRadiusX * .9, maxRadiusY * .88, -Math.PI * .31);
        placeRing(outerTier, maxRadiusX, maxRadiusY, Math.PI * .13);

        nodes.forEach((n) =&gt; {
          n.anchorX = n.baseX;
          n.anchorY = n.baseY;
          n.x = n.anchorX;
          n.y = n.anchorY;
          n.radius = n.id === &#x27;homosexuality&#x27; ? 3.8 : centerIds.has(n.id) ? 3.1 : anchors.has(n.id) ? 2.7 : majorIds.has(n.id) ? 2.25 : n.importance === 3 ? 1.55 : n.importance === 2 ? 1.05 : .68;
          n.scale = 1;
        });
        readTheme();
        draw(false);
      }

      function neighborhood(id) {
        const direct = id ? adjacency.get(id) || new Set() : new Set();
        const second = new Set();
        direct.forEach((neighborId) =&gt; {
          (adjacency.get(neighborId) || new Set()).forEach((nextId) =&gt; {
            if (nextId !== id &amp;&amp; !direct.has(nextId)) second.add(nextId);
          });
        });
        return { direct, second };
      }

      function curvePoint(l) {
        const mx = (l.source.x + l.target.x) / 2;
        const my = (l.source.y + l.target.y) / 2;
        const dx = l.target.x - l.source.x;
        const dy = l.target.y - l.source.y;
        const length = Math.max(1, Math.hypot(dx, dy));
        const amount = Math.min(24, length * Math.abs(l.bend));
        return { x: mx - (dy / length) * amount * Math.sign(l.bend || 1), y: my + (dx / length) * amount * Math.sign(l.bend || 1) };
      }

      function drawEdge(l, alpha, color, lineWidth) {
        const c = curvePoint(l);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        ctx.moveTo(l.source.x, l.source.y);
        ctx.quadraticCurveTo(c.x, c.y, l.target.x, l.target.y);
        ctx.stroke();
        ctx.restore();
      }

      function nodeMinZoom(n) {
        if (majorIds.has(n.id)) return 1;
        if (n.importance === 3) return 1.34;
        if (n.importance === 2) return 1.92;
        return 2.75;
      }

      function labelMinZoom(n) {
        if (majorIds.has(n.id)) return 1;
        if (n.importance === 3) return 1.48;
        if (n.importance === 2) return 2.22;
        return 3.18;
      }

      function isNodeVisible(n, state) {
        return true;
      }

      function revealFactor(n) {
        if (majorIds.has(n.id)) return 1;
        const start = nodeMinZoom(n) - 1;
        const progress = Math.max(0, Math.min(1, (zoomLevel - start) / 1.15));
        return .16 + progress * .84;
      }

      function labelBox(n, textWidth, textHeight, anchor) {
        const gap = n.radius * n.scale + 8;
        const placements = [
          [n.x + gap, n.y - textHeight / 2],
          [n.x - gap - textWidth, n.y - textHeight / 2],
          [n.x - textWidth / 2, n.y - gap - textHeight],
          [n.x - textWidth / 2, n.y + gap],
          [n.x + gap, n.y - gap - textHeight],
          [n.x - gap - textWidth, n.y - gap - textHeight],
          [n.x + gap, n.y + gap],
          [n.x - gap - textWidth, n.y + gap]
        ];
        const point = placements[anchor] || placements[0];
        return {
          x1: point[0] - 3, y1: point[1] - 2,
          x2: point[0] + textWidth + 3, y2: point[1] + textHeight + 2,
          textX: point[0], textY: point[1]
        };
      }

      function boxesCollide(a, b) {
        return !(a.x2 &lt; b.x1 || a.x1 &gt; b.x2 || a.y2 &lt; b.y1 || a.y1 &gt; b.y2);
      }

      function labelFor(n, alpha, active, placement, fontSize) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = active || anchors.has(n.id) ? orangeColor : starColor;
        ctx.font = `${active || anchors.has(n.id) ? 500 : 400} ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif`;
        ctx.textAlign = &#x27;left&#x27;;
        ctx.textBaseline = &#x27;top&#x27;;
        ctx.fillText(n.label, placement.textX, placement.textY);
        if (n.subtitle) {
          ctx.globalAlpha = alpha * .72;
          ctx.fillStyle = softColor;
          ctx.font = `400 11px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif`;
          ctx.fillText(n.subtitle, placement.textX, placement.textY + fontSize + 2);
        }
        ctx.restore();
      }

      function drawLabels(state, visibleIds) {
        const activeIds = new Set(state.edgeIds);
        if (state.activeId) activeIds.add(state.activeId);
        const candidates = nodes.flatMap((n) =&gt; {
          if (!visibleIds.has(n.id)) return [];
          const active = activeIds.has(n.id);
          const neighbor = state.direct.has(n.id);
          if (!active &amp;&amp; !neighbor &amp;&amp; zoomLevel &lt; labelMinZoom(n)) return [];
          const priority = (active ? 1000000 : 0) + (neighbor ? 200000 : 0) + (n.id === &#x27;homosexuality&#x27; ? 140000 : 0) + (centerIds.has(n.id) ? 100000 : 0) + (majorIds.has(n.id) ? 50000 : 0) + n.importance * 1000;
          return [{ n, active, neighbor, priority }];
        }).sort((a, b) =&gt; b.priority - a.priority || a.n.label.localeCompare(b.n.label));

        const cap = zoomLevel &lt; 1.35 ? 14 : zoomLevel &lt; 2 ? 20 : zoomLevel &lt; 3 ? 32 : 48;
        const boxes = [
          { x1: 0, y1: 0, x2: 152, y2: 60 },
          { x1: width - 100, y1: 0, x2: width, y2: 62 }
        ];
        if (detail.classList.contains(&#x27;is-visible&#x27;)) boxes.push({ x1: width * .13, y1: height - 92, x2: width * .87, y2: height });
        let count = 0;
        candidates.some((item) =&gt; {
          const fontSize = item.active ? 13 : majorIds.has(item.n.id) ? 12 : 11;
          ctx.save();
          ctx.font = `${item.active || anchors.has(item.n.id) ? 500 : 400} ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif`;
          const titleWidth = ctx.measureText(item.n.label).width;
          ctx.font = `400 11px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif`;
          const subtitleWidth = item.n.subtitle ? ctx.measureText(item.n.subtitle).width : 0;
          const textWidth = Math.ceil(Math.max(titleWidth, subtitleWidth));
          const textHeight = item.n.subtitle ? fontSize + 15 : fontSize + 3;
          ctx.restore();
          const previous = previousLabelAnchors.get(item.n.id);
          const anchorOrder = previous == null ? [0,1,2,3,4,5,6,7] : [previous, ...[0,1,2,3,4,5,6,7].filter((a) =&gt; a !== previous)];
          let placement = null;
          let chosen = anchorOrder[0];
          for (const anchor of anchorOrder) {
            const candidate = labelBox(item.n, textWidth, textHeight, anchor);
            const inside = candidate.x1 &gt;= 4 &amp;&amp; candidate.x2 &lt;= width - 4 &amp;&amp; candidate.y1 &gt;= 4 &amp;&amp; candidate.y2 &lt;= height - 4;
            if (inside &amp;&amp; !boxes.some((box) =&gt; boxesCollide(candidate, box))) {
              placement = candidate;
              chosen = anchor;
              break;
            }
          }
          if (!placement &amp;&amp; (item.active || centerIds.has(item.n.id) || item.n.id === &#x27;homosexuality&#x27;)) placement = labelBox(item.n, textWidth, textHeight, chosen);
          if (placement) {
            boxes.push(placement);
            previousLabelAnchors.set(item.n.id, chosen);
            labelFor(item.n, item.active ? 1 : item.neighbor ? .8 : .76, item.active, placement, fontSize);

          }

      function drawDust() {
        ctx.save();
        ctx.fillStyle = starColor;
        dust.forEach((s) =&gt; {
          ctx.globalAlpha = s.a;
          ctx.beginPath();
          ctx.arc(s.x * width, 74 + s.y * (height - 145), s.r, 0, Math.PI * 2);
          ctx.fill();

        ctx.restore();
      }

      function relationName(l) {
        if (l.relation) return l.relation;
        const a = l.source.group;
        const b = l.target.group;
        const pair = new Set([a, b]);
        if (pair.has(1) &amp;&amp; pair.has(4)) return &#x27;历史进入人物&#x27;;
        if (pair.has(2) &amp;&amp; pair.has(4)) return &#x27;群体迫使人物表态&#x27;;
        if (pair.has(3) &amp;&amp; pair.has(4)) return &#x27;判决进入身体&#x27;;
        if (pair.has(5) &amp;&amp; pair.has(4)) return &#x27;艺术保存并召回生命&#x27;;
        if (pair.has(1) &amp;&amp; pair.has(2)) return &#x27;国家暴力借制度发生&#x27;;
        if (pair.has(3) &amp;&amp; pair.has(5)) return &#x27;创伤转化为意象与档案&#x27;;
        if (pair.has(0)) return &#x27;核心命题向外展开&#x27;;
        if (a === b) return &#x27;同一层内部互相解释&#x27;;
        return &#x27;两条论证在这里交叉&#x27;;
      }

      function activeState() {
        const activeId = lockedId || hoverId;
        const activeLink = !activeId &amp;&amp; hoverLinkIndex !== null ? links[hoverLinkIndex] : null;
        const edgeIds = activeLink ? new Set([activeLink.source.id, activeLink.target.id]) : new Set();
        const area = neighborhood(activeId);
        return { activeId, activeLink, edgeIds, direct: area.direct, second: area.second };
      }

      function draw(animateScale) {
        ctx.clearRect(0, 0, width, height);
        drawDust();
        const state = activeState();
        const { activeId, activeLink, edgeIds, direct, second } = state;
        const visibleIds = new Set(nodes.filter((n) =&gt; isNodeVisible(n, state)).map((n) =&gt; n.id));
        let stillMoving = false;

        links.forEach((l) =&gt; {
          const incident = activeId &amp;&amp; (l.source.id === activeId || l.target.id === activeId);
          const touchesEdge = activeLink &amp;&amp; l.index === activeLink.index;
          const sharesEdgeNode = activeLink &amp;&amp; !touchesEdge &amp;&amp; (
            edgeIds.has(l.source.id) || edgeIds.has(l.target.id)
          );
          const near = activeId &amp;&amp; !incident &amp;&amp; (
            (direct.has(l.source.id) &amp;&amp; second.has(l.target.id)) ||
            (direct.has(l.target.id) &amp;&amp; second.has(l.source.id))
          );
          const edgeReveal = Math.min(revealFactor(l.source), revealFactor(l.target));
          const majorEdge = majorIds.has(l.source.id) &amp;&amp; majorIds.has(l.target.id);
          const identityEdge = l.source.id === &#x27;homosexuality&#x27; || l.target.id === &#x27;homosexuality&#x27;;
          const symbolEdge = (l.source.id === &#x27;blackball&#x27; &amp;&amp; l.target.id === &#x27;snow&#x27;) || (l.source.id === &#x27;snow&#x27; &amp;&amp; l.target.id === &#x27;blackball&#x27;);
          if (!touchesEdge &amp;&amp; !incident &amp;&amp; (!visibleIds.has(l.source.id) || !visibleIds.has(l.target.id))) return;
          if (touchesEdge) drawEdge(l, .94, orangeColor, 1.65);
          else if (sharesEdgeNode) drawEdge(l, .14, starColor, .8);
          else if (!activeId &amp;&amp; !activeLink &amp;&amp; (identityEdge || symbolEdge)) drawEdge(l, identityEdge ? .24 : .15, orangeColor, identityEdge ? 1.05 : .85);
          else if (!activeId &amp;&amp; !activeLink) drawEdge(l, majorEdge ? .075 : .008 + edgeReveal * .032, softColor, majorEdge ? .72 : .44 + edgeReveal * .18);
          else if (near) drawEdge(l, .09, softColor, .65);
          else if (!incident) drawEdge(l, .012, softColor, .5);
        });

        if (activeId) {
          links.forEach((l) =&gt; {
            if (l.source.id === activeId || l.target.id === activeId) {
              drawEdge(l, .72, starColor, 1.35);
            }
          });
        }

        nodes.forEach((n) =&gt; {
          if (!visibleIds.has(n.id)) return;
          const isActive = n.id === activeId;
          const isEdgeEnd = edgeIds.has(n.id);
          const isDirect = direct.has(n.id);
          const isSecond = second.has(n.id);
          const reveal = revealFactor(n);
          const semanticScale = majorIds.has(n.id) ? 1 : .66 + reveal * .34;
          const targetScale = isActive || isEdgeEnd ? 3.25 : isDirect ? 1.8 : semanticScale;
          if (animateScale &amp;&amp; !reduceMotion) {
            const delta = targetScale - n.scale;
            if (Math.abs(delta) &gt; .02) {
              n.scale += delta * .22;
              stillMoving = true;
            } else n.scale = targetScale;
          } else n.scale = targetScale;
          const hasFocus = activeId || activeLink;
          const idleAlpha = majorIds.has(n.id) ? .95 : .1 + reveal * .52;
          const alpha = !hasFocus ? idleAlpha : isActive || isEdgeEnd ? 1 : isDirect ? .86 : isSecond ? .25 : Math.max(.07, idleAlpha * .22);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = isActive || isEdgeEnd || anchors.has(n.id) ? orangeColor : starColor;
          if (!hasFocus &amp;&amp; majorIds.has(n.id)) {
            ctx.shadowColor = anchors.has(n.id) ? orangeColor : starColor;
            ctx.shadowBlur = 7;
          }
          if (isActive || isEdgeEnd) {
            ctx.shadowColor = orangeColor;
            ctx.shadowBlur = 18;
            ctx.globalAlpha = .22;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.radius * n.scale * 2.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 12;
          }
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius * n.scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        drawLabels(state, visibleIds);
        return stillMoving;
      }

      function updateDetail(id) {
        if (!id) {
          detail.classList.remove(&#x27;is-visible&#x27;);
          categoryEl.textContent = &#x27;&#x27;;
          detailTitle.textContent = &#x27;&#x27;;
          detailText.textContent = &#x27;&#x27;;
          return;
        }
        const n = nodeById.get(id);
        detail.classList.add(&#x27;is-visible&#x27;);
        categoryEl.textContent = groups[n.group].name;
        detailTitle.textContent = n.label;
        detailText.textContent = n.detail;
      }

      function updateLinkDetail(l) {
        detail.classList.add(&#x27;is-visible&#x27;);
        categoryEl.textContent = relationName(l);
        detailTitle.textContent = `${l.source.label} ↔ ${l.target.label}`;
        detailText.textContent = `这条连接说明：${relationName(l)}。`;
      }

      function pickNode(x, y) {
        let best = null;
        let bestDistance = Infinity;
        const state = activeState();
        nodes.forEach((n) =&gt; {
          if (!isNodeVisible(n, state)) return;
          const dist = Math.hypot(n.x - x, n.y - y);
          const hitRadius = Math.max(12, n.radius * n.scale + 7);
          if (dist &lt; hitRadius &amp;&amp; dist &lt; bestDistance) {
            best = n;
            bestDistance = dist;
          }
        });
        return best;
      }

      function quadraticPoint(l, t) {
        const c = curvePoint(l);
        const mt = 1 - t;
        return {
          x: mt * mt * l.source.x + 2 * mt * t * c.x + t * t * l.target.x,
          y: mt * mt * l.source.y + 2 * mt * t * c.y + t * t * l.target.y
        };
      }

      function pickLink(x, y) {
        let best = null;
        let bestDistance = 7;
